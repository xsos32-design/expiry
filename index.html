<style>
:root{
  --ground:#05070a;--surface:#0b1019;--raise:#101724;--hair:#1b2431;--edge:#2a3545;
  --ink:#e8edf3;--faint:#8b94a1;--gold:#ffc53d;
  --choc:#e2a36b;--chocSoft:#3a2414;--smoke:#8fc3e6;--smokeSoft:#10283a;
  --r1:#ff4d7d;--r1s:#3d0d1d;--r2:#ffc53d;--r2s:#3a2c06;--r3:#00efd4;--r3s:#063b35;
  --cut:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ground)}
body{background:var(--ground);color:var(--ink);font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 40px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--edge)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px;font-weight:900;letter-spacing:.02em;line-height:1}
.brand h1 b{color:var(--gold);font-weight:900}
.brand span{font-size:15px;color:var(--faint);font-weight:700}
.sync{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;background:var(--faint);margin-right:5px;vertical-align:1px}
.sync.on i{background:var(--r3);box-shadow:0 0 8px var(--r3)}
.sync.err i{background:var(--r1)}.sync.err{color:var(--r1)}

/* calendar */
.cal{margin-top:12px;background:var(--surface);border:1px solid var(--hair);clip-path:var(--cut)}
.calhd{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 4px}
.calhd .m{font-size:20px;font-weight:900}
.calhd .m small{font-size:13px;color:var(--faint);font-weight:700;margin-left:6px}
.nb{width:40px;height:40px;display:grid;place-items:center;color:var(--faint);font-size:20px}
.nb:hover{color:var(--ink)}
.tday{font-size:12px;border:1px solid var(--edge);padding:6px 10px;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--hair);border-top:1px solid var(--hair)}
.wk{background:var(--surface);text-align:center;font-size:11px;color:var(--faint);padding:4px 0}
.d{background:var(--surface);min-height:52px;padding:4px 3px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.d .n{font-size:14px;font-weight:700}
.d.o{background:var(--ground)}.d.o .n{color:#3d4756}
.d.sun .n,.d.sat .n{color:#b7c0cc}
.d.today .n{color:var(--gold)}
.d.sel{background:var(--raise);box-shadow:inset 0 0 0 2px var(--gold)}
.marks{display:flex;gap:2px;flex-wrap:wrap}
.mk{font-size:10px;font-weight:900;line-height:14px;padding:0 3px;min-width:14px;text-align:center}
.mk.c{background:var(--choc);color:#2a1406}.mk.s{background:var(--smoke);color:#06202f}
.calft{display:flex;gap:12px;flex-wrap:wrap;padding:7px 8px;font-size:12px;color:var(--faint)}
.calft span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.calft .lc::before{background:var(--choc)}.calft .ls::before{background:var(--smoke)}

/* range bar */
.rbar{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rbar h2{font-size:16px;font-weight:900}
.rbar h2 em{font-style:normal;color:var(--gold)}
.seg{display:flex;border:1px solid var(--edge)}
.seg button{padding:8px 12px;font-size:13px;color:var(--faint);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:900}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.sum button{text-align:left;padding:8px 9px;border-left:4px solid;background:var(--surface);min-height:52px}
.sum b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.sum small{font-size:12px;color:var(--faint)}
.sum .b1{border-color:var(--r1)}.sum .b1 b{color:var(--r1)}
.sum .b2{border-color:var(--r2)}.sum .b2 b{color:var(--r2)}
.sum .b3{border-color:var(--r3)}.sum .b3 b{color:var(--r3)}
.sum button[aria-pressed="true"]{background:var(--raise);box-shadow:inset 0 0 0 1px var(--edge)}

/* two columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;align-items:start}
.col{background:var(--surface);border-top:3px solid;min-width:0}
.col.c{border-color:var(--choc)}.col.s{border-color:var(--smoke)}
.colhd{display:flex;align-items:baseline;justify-content:space-between;padding:8px 8px 6px;gap:4px}
.colhd h3{font-size:16px;font-weight:900;white-space:nowrap}
.col.c h3 b{color:var(--choc)}.col.s h3 b{color:var(--smoke)}
.colhd small{color:var(--faint);font-size:12px;white-space:nowrap}
.grp{padding:6px 8px 4px;font-size:12px;font-weight:900;display:flex;justify-content:space-between;border-top:1px solid var(--hair)}
.grp.g0{color:#ff8fae;background:#2a0612}.grp.g1{color:var(--r1)}.grp.g2{color:var(--r2)}.grp.g3{color:var(--r3)}.grp.g4{color:var(--faint)}
.row{display:grid;grid-template-columns:38px 1fr;gap:7px;padding:7px 8px;border-top:1px solid var(--hair);align-items:start}
.th{width:38px;height:38px;background:var(--raise);display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--faint)}
.th img{width:100%;height:100%;object-fit:cover}
.nm{display:block;text-align:left;font-weight:700;font-size:13.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:3px;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:3px;font-size:12px;color:var(--faint);align-items:center}
.meta .ex{color:var(--ink);font-weight:700}
.meta .q{font-weight:900;color:var(--ink)}
.dl{font-weight:900;padding:0 4px}
.dl.u0{background:#ff8fae;color:#2a0612}.dl.u1{background:var(--r1s);color:var(--r1)}.dl.u2{background:var(--r2s);color:var(--r2)}.dl.u3{background:var(--r3s);color:var(--r3)}.dl.u4{color:var(--faint)}
.pull{color:var(--gold);font-weight:700}
.pull.late{background:var(--gold);color:#241900;padding:0 4px}
.cnt{display:flex;align-items:center;gap:4px;margin-top:5px}
.cnt input{width:64px;height:36px;background:var(--ground);border:1px solid var(--edge);text-align:center;font-weight:900;font-size:16px}
.cnt input.chg{border-color:var(--gold);color:var(--gold)}
.cnt span{font-size:12px;color:var(--faint)}
.empty{padding:18px 10px 20px;color:var(--faint);font-size:13px;border-top:1px solid var(--hair)}

/* tools */
.tools{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.prow{display:grid;grid-template-columns:26px 40px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--hair);cursor:pointer}
.prow input,.pall input{width:22px;height:22px;accent-color:var(--gold)}
.prow .th{width:40px;height:40px}
.prow b{display:block;font-size:14px;line-height:1.3}
.prow small{color:var(--faint);font-size:12px}
.prow.due small{color:#f3c9a5}
.pall{display:flex;gap:8px;align-items:center;font-weight:700;padding:4px 0 8px}
.undo{border:1px solid var(--edge);padding:5px 12px;font-size:12px;margin-top:4px;color:var(--ink)}
.msg{width:100%;min-height:300px;background:var(--ground);border:1px solid var(--edge);color:var(--ink);padding:10px;font-size:14px;line-height:1.55;resize:vertical;font-family:inherit}
.tb{background:var(--surface);border:1px solid var(--hair);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;min-height:64px}
.tb svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed="true"]{background:var(--gold);color:#241900;border-color:var(--gold)}
.tb[aria-pressed="true"] svg{stroke:#241900}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;height:42px;background:var(--surface);border:1px solid var(--edge);padding:0 12px}
.cbar{position:sticky;bottom:0;margin-top:10px;background:var(--gold);color:#241900;display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));font-weight:900;z-index:5}
.cbar.on{display:flex}
.cbar select{background:#241900;color:var(--gold);border:0;height:38px;padding:0 8px;font-weight:900}
.cbar button{background:#241900;color:var(--gold);height:38px;padding:0 14px;font-weight:900}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--surface);border-top:3px solid var(--gold);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.mask{align-items:center}.sheet{border:1px solid var(--edge);border-top:3px solid var(--gold)}}
.panel{margin-top:6px;background:var(--surface);border-top:3px solid var(--gold);padding:14px 14px 16px;display:none;scroll-margin-top:10px}
.panel.on{display:block}
body.pon .wrap{padding-bottom:100vh}
.sheet h4,.panel h4{font-size:19px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:40px;height:40px;font-size:22px;color:var(--faint);flex:none}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;color:var(--faint);margin-bottom:4px;font-weight:700}
.f input,.f select{width:100%;height:44px;background:var(--ground);border:1px solid var(--edge);padding:0 10px;font-size:15px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat2{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--edge)}
.cat2 button{height:44px;font-weight:900;color:var(--faint)}
.cat2 button[aria-pressed="true"].c{background:var(--choc);color:#2a1406}
.cat2 button[aria-pressed="true"].s{background:var(--smoke);color:#06202f}
.pick{max-height:190px;overflow:auto;border:1px solid var(--edge);border-top:0;display:none}
.pick.on{display:block}
.pick button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:6px 8px;border-top:1px solid var(--hair);font-size:13px}
.pick img,.pick .ph{width:30px;height:30px;object-fit:cover;flex:none;background:var(--raise)}
.pick small{color:var(--faint)}
.chosen{display:flex;gap:10px;align-items:center;margin-top:6px;padding:6px;background:var(--raise);font-size:13px}
.chosen img{width:44px;height:44px;object-fit:cover}
.go{width:100%;height:48px;background:var(--gold);color:#241900;font-weight:900;font-size:16px;margin-top:4px}
.ghost{width:100%;height:44px;border:1px solid var(--edge);color:var(--ink);font-weight:700;margin-top:8px}
.danger{color:var(--r1);border-color:#4a1626}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.big{width:100%;aspect-ratio:1/1;background:var(--ground);display:grid;place-items:center;overflow:hidden;margin-bottom:12px;border:1px solid var(--hair)}
.big img{width:100%;height:100%;object-fit:contain}
.big .no{color:var(--faint);text-align:center;font-size:13px;padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--faint)}.kv dd{font-weight:700}
.log{font-size:13px}
.log div{padding:8px 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.log small{color:var(--faint)}
.log .dq{font-weight:900}.log .dq.m{color:var(--r1)}.log .dq.p{color:var(--r3)}
.zb{padding:0;cursor:zoom-in}
.big{cursor:zoom-in}
.lb{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
.lb.on{display:flex}
.lbbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(5,7,10,.92);border-bottom:1px solid var(--hair)}
.lbbar b{font-size:15px;line-height:1.3}
.lbbar small{display:block;color:var(--faint);font-size:12px;font-weight:400}

/* ---------- storage：Google 試算表（Apps Script） ---------- */
const API="https://script.google.com/macros/s/AKfycbxwsx9JJLaUBCJdC2WS5k9eKBrx1b5OHH1FhyA9XReiPYkMi2cek3Pvxswy2selR46l/exec",KEY="sa-exp-2026",LSK="sa_exp_cache_v1";
const ONLINE=/^https:\/\/script\.google\.com\//.test(API);
let ver=0,pver=0,queue=[],qp=null,syncing=false;
function cache(){try{localStorage.setItem(LSK,JSON.stringify({lots,logs,photos,ver,pver}))}catch(e){try{localStorage.setItem(LSK,JSON.stringify({lots,logs,photos:{},ver,pver:0}))}catch(_){}}}
function loadCache(){try{const o=JSON.parse(localStorage.getItem(LSK)||"{}");lots=o.lots||[];logs=o.logs||[];photos=o.photos||{};ver=o.ver||0;pver=o.pver||0}catch(e){}}
function setSync(state,txt){const s=$("#sync");s.classList.toggle("on",state==="on");s.classList.toggle("err",state==="err");s.querySelector("span").textContent=txt}
function send(op){
  if(!ONLINE){cache();return Promise.resolve()}
  queue.push(op);
  if(!qp)qp=new Promise((res,rej)=>setTimeout(async()=>{const ops=queue;queue=[];qp=null;setSync("on","儲存中…");
    try{const r=await fetch(API,{method:"POST",body:JSON.stringify({k:KEY,ops})});const j=await r.json();if(!j.ok)throw new Error(j.err||"儲存失敗");ver=j.v;pver=j.pv;cache();setSync("on","已同步 "+hm(new Date()));res(j)}
    catch(e){setSync("err","沒存到雲端，請重新整理");rej(e)}},300));
  return qp;
}
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
async function pull(force){
  if(!ONLINE||syncing||queue.length)return;syncing=true;
  try{
    const v=await (await fetch(API+"?k="+KEY+"&a=ver&t="+Date.now())).json();
    if(!v.ok)throw new Error(v.err);
    if(force||v.v!==ver||v.pv!==pver){
      const all=await (await fetch(API+"?k="+KEY+(force||v.pv!==pver?"&photos=1":"")+"&t="+Date.now())).json();
      if(!all.ok)throw new Error(all.err);
      if(!queue.length){lots=all.lots;logs=all.logs;if(all.photos)photos=all.photos;ver=all.v;pver=all.pv;cache();render();refreshPanel()}
    }
    setSync("on","已同步 "+hm(new Date()));
  }catch(e){setSync("err","連不上雲端，顯示上次資料")}
  finally{syncing=false}
}
async function putLot(l){const i=lots.findIndex(x=>x.id===l.id);i>=0?lots[i]=l:lots.push(l);render();await send({a:"putLot",d:l})}
async function delLot(id){lots=lots.filter(x=>x.id!==id);render();await send({a:"delLot",id})}

/* ---------- rules ---------- */
const pkey=l=>l.cat+"_"+(l.code||[...l.name].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7).toString(36));
const imgOf=l=>photos[pkey(l)]||(l.code&&CATMAP[l.code]&&CATMAP[l.code].img)||"";
function pullDays(l){if(l.cat!=="07")return null;return /godiva|風月堂/i.test((l.brand||"")+l.name)?30:40}
function pullDate(l){const n=pullDays(l);return n?addD(pd(l.exp),-n):null}
function duePull(l){const p=pullDate(l);return pd(l.exp)<=today||(p&&today>=p)}
function bkt(l,base){const e=pd(l.exp);if(e<base)return 0;if(e<addM(base,1))return 1;if(e<addM(base,2))return 2;if(e<addM(base,3))return 3;return 4}
const BN=["已過期","一個月內到期","一到兩個月到期","兩到三個月到期","三個月以後"];
const inStore=l=>!storeF||l.store===storeF;
/* 屆期條碼：到期前 3／2／1 個月各申請一次，進入前一週開始提醒 */
const enterDate=(l,k)=>addM(pd(l.exp),-k);
function applyNow(l,base=today){
  if(!live(l)||pd(l.exp)<=base)return null;
  for(const k of [1,2,3]){const e=enterDate(l,k);if(base>=addD(e,-7)){const done=l.apply&&l.apply[k];return{k,enter:e,late:base>=e,done}}}
  return null;
}
const needApply=l=>{const a=applyNow(l);return a&&!a.done?a:null};
function nextApply(l){if(!live(l))return null;for(const k of [3,2,1]){const e=enterDate(l,k);if(addD(e,-7)>today&&!(l.apply&&l.apply[k]))return{k,enter:e,start:addD(e,-7)}}return null}

/* ---------- calendar ---------- */
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $("#mlabel").innerHTML=(m+1)+"月<small>"+y+"</small>";
  const first=new Date(y,m,1),start=addD(first,-first.getDay());
  const byDay={},bump=(k,t)=>{(byDay[k]=byDay[k]||{c:0,s:0,a:0})[t]++};
  lots.forEach(l=>{if(!live(l)||!inStore(l))return;bump(l.exp,l.cat==="07"?"c":"s");for(const k of [1,2,3]){if(!(l.apply&&l.apply[k])){const e=enterDate(l,k);if(e<pd(l.exp))bump(ymd(e),"a")}}});
  let h=W.split("").map(w=>`<div class="wk">${w}</div>`).join("");
  for(let i=0;i<42;i++){
    const d=addD(start,i),k=ymd(d),b=byDay[k];
    if(i>=35&&d.getMonth()!==m)break;
    const cls=["d",d.getMonth()!==m?"o":"",d.getDay()===0?"sun":"",d.getDay()===6?"sat":"",+d===+today?"today":"",+d===+sel?"sel":""].join(" ");
    h+=`<button class="${cls}" data-d="${k}" aria-label="${k}"><span class="n">${d.getDate()}</span><span class="marks">${b&&b.c?`<span class="mk c">${b.c}</span>`:""}${b&&b.s?`<span class="mk s">${b.s}</span>`:""}${b&&b.a?`<span class="mk a">${b.a}</span>`:""}</span></button>`;
  }
  $("#grid").innerHTML=h;
}
$("#grid").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;sel=pd(b.dataset.d);if(sel.getMonth()!==view.getMonth())view=new Date(sel.getFullYear(),sel.getMonth(),1);bucket=null;mode="near";render()};
$("#prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
$("#next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$("#tday").onclick=()=>{sel=new Date(today);view=new Date(today.getFullYear(),today.getMonth(),1);bucket=null;render()};
$("#sseg").onclick=e=>{const b=e.target.closest("button");if(!b)return;storeF=b.dataset.s;render()};

function rowHTML(l){
  const im=imgOf(l),left=diff(sel,pd(l.exp)),b=bkt(l,sel),pdt=pullDate(l),ap=needApply(l);
  const dtxt=left<0?`過期${-left}天`:left===0?"今天到期":`剩${left}天`;

  const apt=ap?`<span class="ap${ap.late?" late":""}">${ap.late?`${ap.k}個月條碼未申請`:`${mdS(ap.enter)}前申請${ap.k}個月條碼`}</span>`:"";

function parseExp(s,cat){
  s=String(s||"").trim();if(!s)return "";const Y=v=>v<100?2000+v:v;let y,m,d;

    if(cat==="08"){if(parts[0].length===4){y=n[0];m=n[1]}else if(parts[1].length===4){m=n[0];y=n[1]}else{y=Y(n[0]);m=n[1]}}
    else{if(parts.length<3)return "";if(parts[0].length===4){y=n[0];m=n[1];d=n[2]}else if(parts[2].length===4){d=n[0];m=n[1];y=n[2]}else{y=Y(n[0]);m=n[1];d=n[2]}}}
  else{const t=parts[0]||"";
    if(cat==="08"){if(t.length===4){y=Y(+t.slice(0,2));m=+t.slice(2)}else if(t.length===6){y=+t.slice(0,4);m=+t.slice(4)}else return ""}
    else if(t.length===6){y=Y(+t.slice(0,2));m=+t.slice(2,4);d=+t.slice(4)}
    else if(t.length===8){if(/^20/.test(t)){y=+t.slice(0,4);m=+t.slice(4,6);d=+t.slice(6)}else{d=+t.slice(0,2);m=+t.slice(2,4);y=+t.slice(4)}}

async function shrink(f){
  const url=URL.createObjectURL(f);const im=new Image();im.src=url;await im.decode();

  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  let d=c.toDataURL("image/webp",.72);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",.72);return d;
}

async function doPull(arr,by){const at=Date.now();for(const l of arr){await putLot({...l,pulled:{by,at}});await putLog({id:uid(),t:"下架",lot:l.id,cat:l.cat,name:l.name,exp:l.exp,from:l.qty,to:0,by,at})}toast(`已下架 ${arr.length} 批（${by}）`)}

  $("#panel").querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{const l=lots.find(x=>x.id===b.dataset.u);if(!l)return;if(!b.dataset.ok){b.dataset.ok=1;b.textContent="再按一次復原";return}const{pulled,...r}=l;await putLot(r);await putLog({id:uid(),t:"復原下架",lot:l.id,cat:l.cat,name:l.name,exp:l.exp,from:0,to:l.qty,by:($("#pby")&&$("#pby").value)||lastBy||"—",at:Date.now()});pullPanel(true,true);toast("已復原："+l.name)});

function csv(rows){return "\ufeff"+rows.map(r=>r.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\r\n")}
async function doExport(k){
  const st=ymd(today).replace(/-/g,"");let name,data;
  if(k==="near"||k==="all"){
    const a=lots.filter(l=>live(l)&&inStore(l)&&(k==="all"||bkt(l,sel)<=3)).sort((x,y)=>(x.store||"").localeCompare(y.store||"")||x.cat.localeCompare(y.cat)||(x.exp<y.exp?-1:1));
    data=csv([["店別","大類","品號","條碼","品名","品牌","有效日期","剩餘天數","區間","數量","售價","屆期折扣","應下架日","條碼申請(3/2/1個月)","登錄人","登錄日"],...a.map(l=>{const p=pullDate(l);return[l.store||"",l.cat==="07"?"07巧克力":"08菸類",l.no,l.code?"'"+l.code:"",l.name,l.brand,fx(l),diff(sel,pd(l.exp)),BN[bkt(l,sel)],l.qty,l.price,l.disc,p?ymd(p):"",[3,2,1].map(k=>l.apply&&l.apply[k]?l.apply[k].by:"—").join("/"),l.by,new Date(l.at).toLocaleDateString("zh-TW")]})]);
    name=`營三部SA屆期表_${storeF||"全部店"}_${k==="near"?"三個月內":"全部"}_${st}.csv`;
  }else if(k==="log"){
    data=csv([["時間","動作","大類","品名","有效日期","原數量","新數量","人員"],...logs.slice().sort((x,y)=>y.at-x.at).map(g=>[new Date(g.at).toLocaleString("zh-TW"),g.t,g.cat||"",g.name,g.exp||"",g.from,g.to,g.by])]);
    name=`營三部SA屆期紀錄_${st}.csv`;
  }else{data=JSON.stringify({lots,logs},null,1);name=`營三部SA屆期備份_${st}.json`}
  if(DL){try{await DL.save({filename:name,data});toast("已產出 "+name)}catch(e){if(e.code!=="declined")toast("沒辦法存檔："+e.code)}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:k==="json"?"application/json":"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("已產出 "+name);
}

/* ---------- group message ---------- */
let msgType="report",msgRange=3,msgStore="",msgCat="",msgDiscOnly=false;
const CATT={"08":"香煙好好抽🚬","07":"巧克力🍫好好吃"};
let msgDraft={};
const mq=l=>msgDraft[l.id]!=null&&msgDraft[l.id]!==""?Math.max(0,parseInt(msgDraft[l.id],10)||0):l.qty;
function reportLots(){return lots.filter(l=>live(l)&&(!msgStore||l.store===msgStore)&&(!msgCat||l.cat===msgCat)&&bkt(l,sel)>=1&&bkt(l,sel)<=msgRange&&(!msgDiscOnly||l.disc)).sort((x,y)=>x.cat<y.cat?1:x.cat>y.cat?-1:(x.store||"").localeCompare(y.store||"")||(x.exp<y.exp?-1:1))}
function buildReport(){
  let out=`${mdS(sel)}`;
  const pick=reportLots().filter(l=>mq(l)>0);
  if(!pick.length)return out+"\n\n（沒有符合的品項）";
  for(const cat of ["08","07"])for(const st of [...STORES,""]){
    const a=pick.filter(l=>l.cat===cat&&(l.store||"")===st).sort((x,y)=>x.exp<y.exp?-1:1);if(!a.length)continue;
    out+=`\n\n${st||"店別未填"} ${CATT[cat]}`;
    const discs=[...new Set(a.map(l=>l.disc||""))].sort((x,y)=>x===""?1:y===""?-1:0);
    discs.forEach((d,gi)=>{
      const g=a.filter(l=>(l.disc||"")===d);if(d)out+=`\n\n⬇️${d}`;const sp=i=>(i>0||(gi>0&&!d))?"\n":"";
      if(cat==="08"){const names=[...new Set(g.map(l=>l.name))];names.forEach((n,i)=>{const ls=g.filter(l=>l.name===n);out+=sp(i)+`\n${n}`+ls.map(l=>`\n${l.price?"$"+l.price+" ":""}${fx(l)}*${mq(l)}`).join("")})}
      else g.forEach((l,i)=>{out+=sp(i)+`\n${l.name}\n${l.price?"$"+l.price:""}*${mq(l)}\n${fx(l)}`});
    });
  }
  return out;
}
function buildApplyMsg(){
  const a=lots.filter(l=>needApply(l)&&(!msgStore||l.store===msgStore)&&(!msgCat||l.cat===msgCat));
  let out=`【屆期條碼申請提醒】${mdS(today)}（${W[today.getDay()]}）`;
  if(!a.length)return out+"\n\n本週沒有要申請的品項";
  for(const k of [3,2,1]){const g=a.filter(l=>needApply(l).k===k).sort((x,y)=>(x.store||"").localeCompare(y.store||"")||(x.exp<y.exp?-1:1));if(!g.length)continue;
    out+=`\n\n▍${k}個月內到期`+g.map(l=>{const n=needApply(l);return `\n${l.store||""} ${l.cat==="07"?"🍫":"🚬"} ${l.name}\n${fx(l)}*${l.qty}｜${n.late?"⚠️已逾期":mdS(n.enter)+"前申請"}`}).join("")}
  return out+"\n\n申請好請到屆期表按「確認已申請」，謝謝！";
}
function msgSheet(force){
  const segB=(id,arr,v)=>`<div class="seg" id="${id}" style="margin-bottom:8px">${arr.map(([val,lab])=>`<button data-m="${val}" aria-pressed="${String(val)===String(v)}" style="flex:1">${lab}</button>`).join("")}</div>`;
  if(!force)msgDraft={};
  if(!openPanel("msg",`<h4>群組訊息<button class="x" aria-label="關閉">×</button></h4>
  ${segB("mty",[["report","每日回報"],["apply","條碼申請提醒"]],msgType)}
  ${segB("mst",[["","兩店"],["2140","2140"],["2153","2153"]],msgStore)}
  ${segB("mca",[["","兩類"],["08","香煙"],["07","巧克力"]],msgCat)}
  <div id="mopt">${segB("mr",[[1,"一個月內"],[2,"兩個月內"],[3,"三個月內"]],msgRange)}
  <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px"><input type="checkbox" id="mdo" ${msgDiscOnly?"checked":""} style="width:20px;height:20px">只列有屆期折扣的</label>
  <div class="tier" style="display:flex;justify-content:space-between"><span>今日數量</span><span id="mchg" style="color:var(--faint);font-weight:700"></span></div>
  <p class="hint" style="margin:0 0 4px">賣掉幾個就按 −，數量會自己扣、訊息跟著改；扣到 0 就不會出現在回報。</p>
  <div id="mlist"></div></div>
  <div class="tier">訊息預覽</div>
  <textarea class="msg" id="mt" aria-label="訊息內容（可直接修改）"></textarea>
  <p class="hint" id="mhint"></p>
  <div class="f" id="mbyf" style="margin-top:8px"><label>回報人（有改數量時必選）</label><select id="mby">${peopleOpts(lastBy)}</select></div>
  <button class="go" id="mc">複製訊息</button>`,force,force))return;
  const changed=()=>reportLots().filter(l=>mq(l)!==l.qty);
  const list=()=>{const a=reportLots();$("#mlist").innerHTML=a.length?a.map(l=>{const v=mq(l),d=v-l.qty;return `<div class="mrow"><span class="mn"><b>${l.store||"?"} ${l.cat==="07"?"🍫":"🚬"} ${esc(l.name)}</b><small>${fx(l)}${l.disc?"　⬇"+l.disc:""}　帳上 ${l.qty}${d?`<em class="${d<0?"m":"p"}">${d>0?"+":""}${d}</em>`:""}</small></span><span class="step"><button data-dq="${l.id}" data-v="-1" aria-label="減一">−</button><input data-iq="${l.id}" type="number" inputmode="numeric" min="0" value="${v}" class="${d?"chg":""}" aria-label="今日數量"><button data-dq="${l.id}" data-v="1" aria-label="加一">＋</button></span></div>`}).join(""):`<p class="hint">沒有符合的品項</p>`};
  const fill=()=>{const rep=msgType==="report";$("#mopt").style.display=rep?"":"none";$("#mbyf").style.display=rep?"":"none";$("#mt").value=rep?buildReport():buildApplyMsg();
    const n=rep?changed().length:0;$("#mchg").textContent=n?`已改 ${n} 批`:"";$("#mc").textContent=n?`存數量並複製（${n} 批）`:"複製訊息";
    $("#mhint").textContent=rep?`以 ${mdS(sel)} 起算，不含已過期。內容可以先改再複製。`:"列出本週要申請與已逾期未申請的批次。"};
  const full=()=>{list();fill()};full();
  const bind=(id,set)=>{$("#"+id).onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;set(b.dataset.m);document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b));full()}};
  bind("mty",v=>msgType=v);bind("mst",v=>msgStore=v);bind("mca",v=>msgCat=v);bind("mr",v=>msgRange=+v);
  $("#mdo").onchange=e=>{msgDiscOnly=e.target.checked;full()};
  $("#mlist").onclick=e=>{const b=e.target.closest("[data-dq]");if(!b)return;const l=lots.find(x=>x.id===b.dataset.dq);if(!l)return;msgDraft[l.id]=Math.max(0,mq(l)+ +b.dataset.v);const inp=$(`[data-iq="${l.id}"]`);inp.value=msgDraft[l.id];upRow(l);fill()};
  $("#mlist").oninput=e=>{const i=e.target.closest("[data-iq]");if(!i)return;msgDraft[i.dataset.iq]=i.value;const l=lots.find(x=>x.id===i.dataset.iq);if(l)upRow(l);fill()};
  const upRow=l=>{const i=$(`[data-iq="${l.id}"]`);if(!i)return;const d=mq(l)-l.qty;i.classList.toggle("chg",!!d);const sm=i.closest(".mrow").querySelector("small");const em=sm.querySelector("em");if(em)em.remove();if(d)sm.insertAdjacentHTML("beforeend",`<em class="${d<0?"m":"p"}">${d>0?"+":""}${d}</em>`)};
  $("#mby").onchange=e=>remember(e.target.value);
  const copy=async txt=>{const t=$("#mt");let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}if(!ok){t.focus();t.select();t.setSelectionRange(0,t.value.length);try{ok=document.execCommand("copy")}catch(e){}}return ok};
  $("#mc").onclick=async()=>{
    const txt=$("#mt").value,ch=msgType==="report"?changed():[];
    if(ch.length){const by=$("#mby").value;if(!by)return toast("有改數量，請先選回報人");remember(by);const at=Date.now();
      try{for(const l of ch){const v=mq(l);await putLot({...l,qty:v});await putLog({id:uid(),t:"每日回報扣數",lot:l.id,cat:l.cat,name:l.name,exp:l.exp,from:l.qty,to:v,by,at})}}catch(e){return toast("數量沒存成功："+(e.code||e.message))}
      msgDraft={};}
    const ok=await copy(txt);
    if(ch.length)msgSheet(true);
    toast(ok?(ch.length?`已存 ${ch.length} 批數量，訊息已複製`:"已複製，貼到群組即可"):"已全選，請長按選「複製」");
    if(!ok){const t=$("#mt");if(t){t.value=txt;t.focus();t.select()}}
  };
}
$("#tMsg").onclick=()=>msgSheet(false);

  const flow=g.f.map((x,i)=>{const arr=i?`<div class="garr">▼</div>`:"";if(x.or){n++;return arr+`<div class="gor">${gStep([x.or[0][0],x.or[0][1]],n).replace(/<i>.*?<\/i>/,"")}<span>或</span>${gStep([x.or[1][0],x.or[1][1]],n).replace(/<i>.*?<\/i>/,"")}</div>`}n++;return arr+gStep(x,n)}).join("");
  $("#guide").innerHTML=`<div class="ghd"><b>新手教學 <em>${gi+1}/${GUIDE.length}</em></b><button id="gskip">略過</button></div>
  <div class="gtabs" id="gtabs">${GUIDE.map((x,i)=>`<button data-g="${i}" aria-pressed="${i===gi}">${x.t}</button>`).join("")}</div>
  <div class="gbody"><h3>${g.t}</h3><p class="gsub">${g.s}</p><div class="gflow">${flow}</div>${g.n?`<div class="gnote">${g.n}</div>`:""}<div class="gdots">${GUIDE.map((x,i)=>`<i class="${i===gi?"on":""}"></i>`).join("")}</div></div>
  <div class="gft"><button id="gprev"${gi?"":" disabled style=\"opacity:.35\""}>上一步</button><button class="gn" id="gnext">${gi===GUIDE.length-1?"開始使用":"下一步：" +GUIDE[gi+1].t}</button></div>`;
  $("#gtabs").onclick=e=>{const b=e.target.closest("[data-g]");if(b){gi=+b.dataset.g;renderGuide()}};
  const at=$(`#gtabs [data-g="${gi}"]`);if(at)at.scrollIntoView({inline:"center",block:"nearest"});
  $("#gskip").onclick=closeGuide;$("#gprev").onclick=()=>{if(gi){gi--;renderGuide()}};
  $("#gnext").onclick=()=>{if(gi<GUIDE.length-1){gi++;renderGuide();$(".gbody").scrollTop=0}else closeGuide()};
}
function openGuide(i){gi=i||0;renderGuide();$("#guide").classList.add("on");document.body.style.overflow="hidden"}
function closeGuide(){$("#guide").classList.remove("on");document.body.style.overflow="";try{localStorage.setItem("sa_exp_guide_v1","1")}catch(e){}if(!lastBy)setTimeout(()=>{toast("先在右上角選操作人");const w=$("#who");w.classList.add("need")},300)}
$("#help").onclick=()=>openGuide(0);

const WHO=$("#who");WHO.innerHTML=`<option value="">操作人？</option>`+PEOPLE.map(p=>`<option>${p}</option>`).join("");WHO.value=lastBy;WHO.classList.toggle("need",!lastBy);WHO.onchange=()=>{remember(WHO.value);toast(WHO.value?"操作人："+WHO.value:"已清除操作人")};
render();
try{if(!localStorage.getItem("sa_exp_guide_v1"))openGuide(0)}catch(e){}
</script>
</body>
</html>
